name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: avizor
          POSTGRES_USER: avizor
          POSTGRES_PASSWORD: avizor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avizor -d avizor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://avizor:avizor@localhost:5432/avizor
      DATABASE_SSL: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Prepare test database
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: E2E smoke tests
        env:
          RATE_LIMIT_TRUSTED_PROXY: railway
          RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-secret
        run: npm run test:e2e
